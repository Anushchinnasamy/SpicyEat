services:
  - type: web
    name: api-gateway
    runtime: docker
    plan: free
    region: oregon
    dockerContext: backend
    dockerfilePath: backend/api-gateway/Containerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8080"
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_USERNAME
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL
        value: "true"
      - key: AUTH_SERVICE_URI
        value: http://auth-service:8081
      - key: USER_SERVICE_URI
        value: http://user-service:8082
      - key: MENU_SERVICE_URI
        value: http://menu-service:8083
      - key: CART_SERVICE_URI
        value: http://cart-service:8084
      - key: ORDER_SERVICE_URI
        value: http://order-service:8085
      - key: PAYMENT_SERVICE_URI
        value: http://payment-service:8086
      - key: DELIVERY_SERVICE_URI
        value: http://delivery-service:8087
      - key: NOTIFICATION_SERVICE_URI
        value: http://notification-service:8090

  - type: web
    name: auth-service
    runtime: docker
    plan: free
    region: oregon
    dockerContext: backend
    dockerfilePath: backend/auth-service/Containerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8081"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: spicyeat_auth
      - key: JWT_SECRET
        sync: false
      - key: NOTIFICATION_SERVICE_URI
        value: http://notification-service:8090
      - key: FRONTEND_RESET_PASSWORD_URL
        sync: false

  - type: web
    name: user-service
    runtime: docker
    plan: free
    region: oregon
    dockerContext: backend
    dockerfilePath: backend/user-service/Containerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8082"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: spicyeat_user

  - type: web
    name: menu-service
    runtime: docker
    plan: free
    region: oregon
    dockerContext: backend
    dockerfilePath: backend/menu-service/Containerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8083"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: spicyeat_menu
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_USERNAME
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL
        value: "true"

  - type: web
    name: cart-service
    runtime: docker
    plan: free
    region: oregon
    dockerContext: backend
    dockerfilePath: backend/cart-service/Containerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8084"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: spicyeat_cart
      - key: MENU_SERVICE_URI
        value: http://menu-service:8083

  # Kafka is intentionally NOT configured for this deployment (no managed Kafka
  # provider wired up yet). order/payment/delivery/notification-service fall
  # back to their localhost:9092 default, which is unreachable from Render, so
  # Kafka producers/consumers just log connection warnings and retry forever —
  # harmless to app health, but these features won't fire in production:
  #   - order-placed / payment-succeeded emails
  #   - order status auto-advancing PLACED -> CONFIRMED after payment
  #   - delivery record auto-creating when a payment succeeds
  # (Same gaps local dev has without podman Kafka running.) Add
  # KAFKA_BOOTSTRAP_SERVERS/KAFKA_SECURITY_PROTOCOL/KAFKA_SASL_* env vars to
  # the four services below once you wire up a managed Kafka provider.

  - type: web
    name: order-service
    runtime: docker
    plan: free
    region: oregon
    dockerContext: backend
    dockerfilePath: backend/order-service/Containerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8085"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: spicyeat_order
      - key: CART_SERVICE_URI
        value: http://cart-service:8084
      - key: MENU_SERVICE_URI
        value: http://menu-service:8083
      - key: USER_SERVICE_URI
        value: http://user-service:8082
      - key: PAYMENT_SERVICE_URI
        value: http://payment-service:8086

  - type: web
    name: payment-service
    runtime: docker
    plan: free
    region: oregon
    dockerContext: backend
    dockerfilePath: backend/payment-service/Containerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8086"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: spicyeat_payment
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CURRENCY
        value: inr

  - type: web
    name: delivery-service
    runtime: docker
    plan: free
    region: oregon
    dockerContext: backend
    dockerfilePath: backend/delivery-service/Containerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8087"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: spicyeat_delivery
      - key: ORDER_SERVICE_URI
        value: http://order-service:8085

  - type: web
    name: notification-service
    runtime: docker
    plan: free
    region: oregon
    dockerContext: backend
    dockerfilePath: backend/notification-service/Containerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8090"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: spicyeat_notification
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        value: "SpicyEat <onboarding@resend.dev>"
      - key: AUTH_SERVICE_URI
        value: http://auth-service:8081
