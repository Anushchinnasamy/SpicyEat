server:
  port: 8085

spring:
  application:
    name: order-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spicyeat_order}
    username: ${DB_USERNAME:spicyeat}
    password: ${DB_PASSWORD:spicyeat}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:spicyeat_order}

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DB_SCHEMA:spicyeat_order}
    schemas: ${DB_SCHEMA:spicyeat_order}
    create-schemas: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

spicyeat:
  services:
    cart-uri: ${CART_SERVICE_URI:http://localhost:8084}
    menu-uri: ${MENU_SERVICE_URI:http://localhost:8083}
    user-uri: ${USER_SERVICE_URI:http://localhost:8082}

  kafka:
    order-topic: ${ORDER_EVENTS_TOPIC:spicyeat.order.events}
    payment-topic: ${PAYMENT_EVENTS_TOPIC:spicyeat.payment.events}

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      menuService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - com.spicyeat.common.error.ApiException

      userService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - com.spicyeat.common.error.ApiException

  retry:
    instances:
      menuService:
        maxAttempts: 3
        waitDuration: 200ms
        ignoreExceptions:
          - com.spicyeat.common.error.ApiException

      userService:
        maxAttempts: 3
        waitDuration: 200ms
        ignoreExceptions:
          - com.spicyeat.common.error.ApiException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: order-service

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId}] %logger{36} - %msg%n"
