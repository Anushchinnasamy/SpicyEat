server:
  port: 8084

spring:
  application:
    name: cart-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spicyeat_cart}
    username: ${DB_USERNAME:spicyeat}
    password: ${DB_PASSWORD:spicyeat}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:spicyeat_cart}

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DB_SCHEMA:spicyeat_cart}
    schemas: ${DB_SCHEMA:spicyeat_cart}

spicyeat:
  services:
    menu-uri: ${MENU_SERVICE_URI:http://localhost:8083}

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      menuService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - com.spicyeat.common.error.ApiException

  retry:
    instances:
      menuService:
        maxAttempts: 3
        waitDuration: 200ms
        ignoreExceptions:
          - com.spicyeat.common.error.ApiException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: cart-service

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId}] %logger{36} - %msg%n"
