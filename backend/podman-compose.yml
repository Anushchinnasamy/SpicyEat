version: "3.9"

# Local infrastructure ONLY — Redis, Kafka.
# Spring Boot services are intentionally NOT defined here: they run directly
# on the host (mvn/jar), not inside Podman, to keep the Podman VM's 2GB RAM
# free for infra containers only. See scripts/services.ps1 to run services.
#
# Postgres is NOT defined here either: this machine runs a native PostgreSQL
# Windows service on port 5432, so the containerized Postgres from the
# original full-stack compose was dropped to avoid a port conflict. The
# spicyeat role + spicyeat_* databases (see
# infrastructure/postgres/init-databases.sh for the list) were created once
# directly on the native instance.
#
# Note: this file requires a compose provider (docker-compose or
# podman-compose) on PATH. If you don't have one installed, use
# scripts/infra.ps1 instead, which drives the same containers via plain
# `podman run` and needs no extra tooling.

services:
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: spicyeat-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: docker.io/apache/kafka:3.8.0
    container_name: spicyeat-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # Advertised as localhost, not "kafka", because Spring Boot services
      # now run on the host, not in this compose network.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
