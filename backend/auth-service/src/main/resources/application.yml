server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spicyeat_auth}
    username: ${DB_USERNAME:spicyeat}
    password: ${DB_PASSWORD:spicyeat}
    hikari:
      maximum-pool-size: 1
      minimum-idle: 0
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:spicyeat_auth}

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DB_SCHEMA:spicyeat_auth}
    schemas: ${DB_SCHEMA:spicyeat_auth}
    create-schemas: true

spicyeat:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes+}
    access-token-ttl-minutes: ${ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:30}
    password-reset-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}

  services:
    notification-uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8090}

  frontend:
    reset-password-url: ${FRONTEND_RESET_PASSWORD_URL:http://localhost:5192/reset-password}

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: auth-service

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId}] %logger{36} - %msg%n"
