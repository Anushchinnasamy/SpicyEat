server:
  port: 8087

spring:
  application:
    name: delivery-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spicyeat_delivery}
    username: ${DB_USERNAME:spicyeat}
    password: ${DB_PASSWORD:spicyeat}
    hikari:
      maximum-pool-size: 1
      minimum-idle: 0
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:spicyeat_delivery}

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DB_SCHEMA:spicyeat_delivery}
    schemas: ${DB_SCHEMA:spicyeat_delivery}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: delivery-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

spicyeat:
  services:
    order-uri: ${ORDER_SERVICE_URI:http://localhost:8085}

  kafka:
    payment-topic: ${PAYMENT_EVENTS_TOPIC:spicyeat.payment.events}

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: delivery-service

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId}] %logger{36} - %msg%n"
