server:
  port: 8083

spring:
  application:
    name: menu-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spicyeat_menu}
    username: ${DB_USERNAME:spicyeat}
    password: ${DB_PASSWORD:spicyeat}
    hikari:
      maximum-pool-size: 1
      minimum-idle: 0
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:spicyeat_menu}

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DB_SCHEMA:spicyeat_menu}
    schemas: ${DB_SCHEMA:spicyeat_menu}

  cache:
    type: redis

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      connect-timeout: 2s
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: menu-service

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId}] %logger{36} - %msg%n"
